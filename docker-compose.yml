services:
  app:
    build: .
    container_name: nyamtori-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://db:3306/nyamtori?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1200m

  db:
    image: mysql:8.0
    container_name: nyamtori-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: nyamtori
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USERNAME}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 700m

volumes:
  db-data:
