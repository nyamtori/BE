server:
  port: 8081
  forward-headers-strategy: framework
  tomcat:
    max-swallow-size: 20MB

spring:
  application:
    name: nyamtori
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  jackson:
    serialization:
      fail-on-empty-beans: false

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_REST_API_KEY}
            client-secret: ${KAKAO_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            client-authentication-method: client_secret_post
            client-name: Kakao
            scope:
              - profile_nickname

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN

jwt:
  secret: ${JWT_SECRET}
  access-token-expire-time: 3600000   # 1시간 (ms)
  refresh-token-expire-time: 1209600000 # 14일 (ms)

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    disable-swagger-default-url: true
    display-request-duration: true

foodsafety:
  api:
    key: ${FOODSAFETY_API_KEY:0b8406a292e040a499b0}
    base-url: http://openapi.foodsafetykorea.go.kr/api

gemini:
  api-key: ${GEMINI_API_KEY}
  url: "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent"

ocr:
  tessdata-path: ${TESSDATA_PATH:/app/tessdata}
  language: kor+eng

app:
  oauth:
    frontend-redirect-uri: ${FRONTEND_OAUTH_REDIRECT_URI}
